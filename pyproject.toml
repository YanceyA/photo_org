[project]
name = "photoflow"
version = "0.1.0"
description = "Incremental, non-destructive photo library organizer"
requires-python = ">=3.11"
dependencies = [
    "pillow-heif>=1.4.0",
]

[project.optional-dependencies]
images = ["Pillow", "ImageHash", "pillow-heif"]
# Face detection + content tagging. CLIP/SigLIP (open-clip-torch) is the always-installable
# tagger, so [enrich] alone is fully functional; RAM++ is a separate git + 3GB-checkpoint
# step (see README). GPU users: swap onnxruntime->onnxruntime-gpu and install the CUDA torch
# build. Note: InsightFace runs on CPU on Pascal+Py3.14 (onnxruntime-gpu #27588).
enrich = [
    "insightface",
    "onnxruntime",
    "scikit-learn",
    "numpy",
    "opencv-python-headless",
    "torch",
    "open-clip-torch",
    "timm",
    "transformers",  # text tower for the default SigLIP CLIP tagger AND RAM++'s BERT
    "huggingface-hub",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "Pillow",
    "ImageHash",
    "pre-commit>=4.6.0",
    "scikit-learn>=1.9.0",
]

[project.scripts]
photoflow = "photoflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photoflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "exiftool: requires exiftool on PATH (skipped when absent)",
    "enrich: requires the [enrich] model stack (insightface/torch/open_clip; skipped when absent)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# load-bearing line in the XMP packet template (verbatim from the deleted reference implementation)
"src/photoflow/xmp.py" = ["E501"]
# load-bearing HTML/JS template; wrapping the inline handlers/strings would break readability
"src/photoflow/enrich/page.py" = ["E501"]
